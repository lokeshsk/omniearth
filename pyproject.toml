[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniearth"
version = "1.1.0"
description = "Universal Multi-Modal Open Earth Observation, Hyperspectral, and Weather Data Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Lokesh Kumar", email = "lokesh.skshukla@gmail.com" }
]
keywords = [
  "earth-observation",
  "remote-sensing",
  "hyperspectral",
  "stac",
  "weather",
  "soilgrids",
  "sentinel-2",
  "enmap",
  "prisma",
  "landsat",
  "elevation",
  "dem",
  "landcover",
  "emit",
  "copernicus",
  "open-meteo"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "requests>=2.28.0",
  "pydantic>=2.0.0",
  "tqdm>=4.64.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
gis = [
  "rasterio>=1.3.0",
  "shapely>=2.0.0",
  "geopandas>=0.13.0"
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://lokeshsk.github.io/omniearth/"
Repository = "https://github.com/lokeshsk/omniearth"
Documentation = "https://lokeshsk.github.io/omniearth/"
"Bug Tracker" = "https://github.com/lokeshsk/omniearth/issues"

[project.scripts]
omniearth = "omniearth.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omniearth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["omniearth"]

[tool.coverage.report]
fail_under = 100
show_missing = true

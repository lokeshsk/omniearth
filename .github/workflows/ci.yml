name: OmniEarth CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python ${{ matrix.python-version }} (uv)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      UV_NO_KEYRING: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies with uv
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Run Python Test Suite (pytest)
        run: |
          uv run pytest -v --cov=omniearth tests/

      - name: Build Python Package (Wheel & sdist)
        run: |
          uv build

  test-node:
    name: Node.js ${{ matrix.node-version }} (pnpm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build TypeScript SDK & CLI
        run: pnpm run build

      - name: Run Node.js Test Suite
        run: pnpm test

      - name: Pack npm Distribution Tarball
        run: pnpm pack

  metadata-and-citations:
    name: Validate Metadata & Citations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Zenodo JSON
        run: |
          python3 -c "import json; json.load(open('.zenodo.json'))"

      - name: Check License & Citation Existence
        run: |
          test -f LICENSE || exit 1
          test -f CITATION.cff || exit 1
          test -f .zenodo.json || exit 1
          test -f .env.example || exit 1


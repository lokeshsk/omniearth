name: Publish OmniEarth to PyPI and npm

on:
  release:
    types: [ published ]
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-pypi:
    name: Publish to PyPI (uv)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build Wheel & Sdist
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN || secrets.UV_PUBLISH_TOKEN }}
        run: |
          if [ -n "$UV_PUBLISH_TOKEN" ]; then
            echo "Publishing to PyPI using repository secret token..."
            uv publish --check-url https://pypi.org/simple/ --token "$UV_PUBLISH_TOKEN" || echo "Notice: Package version already on PyPI"
          else
            echo "Publishing to PyPI using Trusted Publishing (OIDC)..."
            uv publish --check-url https://pypi.org/simple/ --trusted-publishing always || echo "Notice: Package version already on PyPI"
          fi

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Build TypeScript SDK & CLI
        run: pnpm run build

      - name: Run Test Suite
        run: pnpm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN || secrets.NPM_API_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN || secrets.NPM_API_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view omniearth@${CURRENT_VERSION} version 2>/dev/null || true)
          if [ "$REMOTE_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Notice: Package omniearth@${CURRENT_VERSION} is already published on npm registry. Skipping duplicate publish."
          else
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              echo "Configuring npm authentication from repository secret..."
              echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
              echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
              npm publish --access public
            else
              echo "Publishing via npm Trusted Publishing (OIDC)..."
              npm publish --provenance --access public
            fi
          fi

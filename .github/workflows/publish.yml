name: Publish OmniEarth to PyPI and npm

on:
  release:
    types: [ published ]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-pypi:
    name: Publish to PyPI (uv / Trusted Publishing)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build Wheel & Sdist
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$UV_PUBLISH_TOKEN" ]; then
            echo "Publishing to PyPI using token..."
            uv publish --token "$UV_PUBLISH_TOKEN"
          else
            echo "Publishing to PyPI using Trusted Publishing (OIDC)..."
            uv publish --trusted-publishing always
          fi

  publish-npm:
    name: Publish to npm (Trusted Publishing / OIDC)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Build TypeScript SDK & CLI
        run: pnpm run build

      - name: Run Test Suite
        run: pnpm test

      - name: Ensure latest npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish to npm using Trusted Publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing to npm using token..."
            pnpm publish --no-git-checks --access public
          else
            echo "Publishing to npm using Trusted Publishing (OIDC + Provenance)..."
            npm publish --provenance --access public
          fi
